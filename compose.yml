services:
  ui:
    build:
      context: .
    init: true
    command: pnpm dev --host 0.0.0.0
    environment:
      NUXT_API_BASE: ${NUXT_API_BASE:-http://host.docker.internal:8000/api}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - ui_node_modules:/app/node_modules
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  ui_node_modules:
